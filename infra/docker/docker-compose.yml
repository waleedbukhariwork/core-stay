name: codecore-local

services:
  postgres:
    image: postgres:18
    container_name: codecore-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codecore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codecore_local_only_not_for_prod}
      POSTGRES_DB: ${POSTGRES_DB:-codecore}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - codecore_pg_local:/var/lib/postgresql

volumes:
  codecore_pg_local:
